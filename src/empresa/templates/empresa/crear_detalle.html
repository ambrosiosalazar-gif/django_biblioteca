<h2>Agregar Producto a Venta #{{ venta.id }}</h2>
<form method="POST">
    {% csrf_token %}
    <label>Producto:</label><br>
    <select name="producto" required>
        {% for prod in productos %}
            <option value="{{ prod.id }}">{{ prod.nombre }} - S/ {{ prod.precio }}</option>
        {% endfor %}
    </select><br><br>

    <label>Cantidad:</label><br>
    <input type="number" name="cantidad" value="1" min="1" required><br><br>

    <label>Precio Unitario:</label><br>
    <input type="number" step="0.01" name="precio_unitario" required><br><br>

    <button type="submit">Agregar a la Venta</button>
    <a href="{% url 'detalle_venta' venta.id %}">Cancelar</a>
</form>
