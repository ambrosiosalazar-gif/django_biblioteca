<h2>Editar Item de la Venta</h2>
<form method="POST">
    {% csrf_token %}
    <label>Producto:</label><br>
    <input type="text" value="{{ detalle.producto.nombre }}" disabled><br><br>

    <label>Cantidad:</label><br>
    <input type="number" name="cantidad" value="{{ detalle.cantidad }}" required><br><br>

    <label>Precio Unitario:</label><br>
    <input type="number" step="0.01" name="precio_unitario" value="{{ detalle.precio_unitario }}" required><br><br>

    <button type="submit">Guardar Cambios</button>
    <a href="{% url 'detalle_venta' detalle.venta.id %}">Cancelar</a>
</form>
